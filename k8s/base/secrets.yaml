apiVersion: v1
kind: Secret
metadata:
  name: eshop-secrets
  namespace: eshop
type: Opaque
stringData:
  # PostgreSQL
  postgres-password: "Pass@word"
  
  # RabbitMQ
  rabbitmq-password: "guest"
  
  # Connection Strings (base64 encoded in production)
  catalogdb-connection: "Host=postgres;Port=5432;Database=catalogdb;Username=postgres;Password=Pass@word"
  identitydb-connection: "Host=postgres;Port=5432;Database=identitydb;Username=postgres;Password=Pass@word"
  orderingdb-connection: "Host=postgres;Port=5432;Database=orderingdb;Username=postgres;Password=Pass@word"
  webhooksdb-connection: "Host=postgres;Port=5432;Database=webhooksdb;Username=postgres;Password=Pass@word"
  
  # Redis
  redis-connection: "redis:6379"
  
  # RabbitMQ
  eventbus-connection: "amqp://guest:guest@rabbitmq:5672"
  
  # JWT Token (generate a secure key for production)
  jwt-secret: "ThisIsASecretKeyForJWTTokenGeneration123456789"
