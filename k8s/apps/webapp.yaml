apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: eshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: aady12/webapp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_URLS
        - name: IdentityUrl
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: IdentityUrl
        - name: BasketApiUrl
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: BasketApiUrl
        - name: CatalogApiUrl
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: CatalogApiUrl
        - name: OrderingApiUrl
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: OrderingApiUrl
        - name: ConnectionStrings__EventBus
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: eventbus-connection
        - name: CallBackUrl
          value: "http://webapp:8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: eshop
spec:
  selector:
    app: webapp
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
