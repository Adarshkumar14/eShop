apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
    spec:
      containers:
      - name: order-processor
        image: aady12/order-processor:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__OrderingDB
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: orderingdb-connection
        - name: ConnectionStrings__EventBus
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: eventbus-connection
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
