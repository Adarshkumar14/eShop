apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
  namespace: eshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: basket-api
  template:
    metadata:
      labels:
        app: basket-api
    spec:
      containers:
      - name: basket-api
        image: aady12/basket-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_URLS
        - name: ConnectionStrings__redis
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: redis-connection
        - name: ConnectionStrings__EventBus
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: eventbus-connection
        - name: Identity__Url
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: IdentityUrl
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: basket-api
  namespace: eshop
spec:
  selector:
    app: basket-api
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
