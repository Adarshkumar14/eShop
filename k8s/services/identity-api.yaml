apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: eshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      containers:
      - name: identity-api
        image: aady12/identity-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_URLS
        - name: ConnectionStrings__IdentityDB
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: identitydb-connection
        - name: BasketApiClient
          value: "http://basket-api:8080"
        - name: OrderingApiClient
          value: "http://ordering-api:8080"
        - name: WebhooksApiClient
          value: "http://webhooks-api:8080"
        - name: WebhooksWebClient
          value: "http://webhooksclient:8080"
        - name: WebAppClient
          value: "http://webapp:8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: eshop
spec:
  selector:
    app: identity-api
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
